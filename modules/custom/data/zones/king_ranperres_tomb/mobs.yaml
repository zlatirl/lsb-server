      drops:
        - chance: always
          item: clump_of_cashmere_wool
        - chance: always
          item: clump_of_cashmere_wool
        - chance: always
          item: spool_of_cashmere_thread
        - chance: always
          item: spool_of_cashmere_thread
        - chance: common
          item: revilers_helm
        - chance: very_common
          one_of:
            dragon_talon: 45
            vial_of_dragon_blood: 45
            slice_of_dragon_meat: 10
        - chance: very_common
          one_of:
            wyrm_horn: 75
            dragon_heart: 25
        - chance: very_common
          one_of:
            - damascus_ingot
            - divine_log
            - square_of_damascene_cloth
            - spool_of_malboro_fiber
            - behemoth_hide
            - vial_of_black_beetle_blood
            - piece_of_oxblood
            - lock_of_sirens_hair
        - chance: very_common
          item: kholomodumos_hide
        - chance: uncommon
          item: kholomodumos_hide

