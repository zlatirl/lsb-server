# ERA Custom: era mob adjustments (was modules/custom/sql/era_mob_adjustments.sql and era_custom_drops.sql).
# content: null removes the Abyssea/RoV content tag, so those mobs spawn on era whatever the content settings.
# loot lists are the retail drops plus era's additions; YAML lists replace rather than append.

templates:
  Locus_Colibri:
    content: null
  Locus_Wivre:
    content: null
  Colibri:
    loot:
      drops:
        - chance: very_common
          item: colibri_feather
        - chance: uncommon
          item: colibri_beak
        - chance: 40
          item: giant_bird_feather
  Olden_Treant:
    loot:
      drops:
        - chance: very_common
          item: dryad_root
        - chance: common
          item: sprig_of_mistletoe
        - chance: uncommon
          item: puffball
        - chance: rare
          one_of:
            rosewood_log: 45
            mahogany_log: 30
            ebony_log: 15
            petrified_log: 10
        - chance: always
          item: lacquer_tree_log

